name: Source and runtime checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: python scripts/release.py check
      - run: python scripts/release.py check-index
      - run: python scripts/release.py check-history
      - run: python -m unittest discover -s tests -v
      - run: npm ci
      - run: npm run test:progress
      - run: npm run build
      - run: git diff --exit-code -- web/hub.js
